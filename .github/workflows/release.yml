name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate icons
        run: |
          mkdir -p build/icons
          convert assets/icon.png -resize 16x16 build/icons/16x16.png
          convert assets/icon.png -resize 32x32 build/icons/32x32.png
          convert assets/icon.png -resize 48x48 build/icons/48x48.png
          convert assets/icon.png -resize 64x64 build/icons/64x64.png
          convert assets/icon.png -resize 128x128 build/icons/128x128.png
          convert assets/icon.png -resize 256x256 build/icons/256x256.png
          cp assets/icon.png build/icons/512x512.png
      
      - name: Build .deb package
        run: npm run dist
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.deb
          body: |
            ## ChatGPT Desktop Client for Linux v${{ steps.get_version.outputs.VERSION }}
            
            ### Installation
            
            **Debian/Ubuntu:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/chatgpt-desktop-client_${{ steps.get_version.outputs.VERSION }}_amd64.deb
            sudo apt install ./chatgpt-desktop-client_${{ steps.get_version.outputs.VERSION }}_amd64.deb
            ```
            
            ### What's Included
            - ✅ Zero security vulnerabilities
            - ✅ Latest Electron v39.2.6+
            - ✅ Persistent login sessions
            - ✅ Native .deb package
            - ✅ Multi-size icon integration
            
            See [README](https://github.com/${{ github.repository }}) for full details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
